name: APK de prueba

# Genera el APK en cada push a main y cuando se pide a mano (Actions → APK de prueba → Run workflow,
# en cualquier rama). Lo publica siempre en la misma pre-release "apk-dev" para descargarlo desde el teléfono:
#   https://github.com/<dueño>/gip/releases/tag/apk-dev
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # para publicar la pre-release

concurrency:
  group: apk-dev
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.x"
          cache: true

      - name: Dependencias y código generado
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      # Firma fija: sin esto cada build sale firmado con una llave distinta y el teléfono
      # obliga a desinstalar la app (y se pierde la base local) para instalar la nueva.
      # Gradle la toma de GIP_KEYSTORE (android/app/build.gradle.kts), no de ~/.android.
      - name: Llave de firma fija
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Falta el secreto ANDROID_DEBUG_KEYSTORE_B64: cada APK tendrá otra firma."
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gip.keystore"
            echo "GIP_KEYSTORE=$RUNNER_TEMP/gip.keystore" >> "$GITHUB_ENV"
          fi

      # El teléfono no ve el Supabase local de nadie: el APK apunta al proyecto de pruebas en Supabase Cloud.
      - name: Configuración de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s"}\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env.json

      - name: Compilar APK
        run: |
          flutter build apk --release --dart-define-from-file=.env.json
          cp build/app/outputs/flutter-apk/app-release.apk "gip-${GITHUB_SHA::7}.apk"

      # Si el APK no salió con la llave fija, no se publica: instalarlo obligaría a desinstalar la app.
      - name: Verificar la firma
        if: env.GIP_KEYSTORE != ''
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          esperada=$(keytool -list -v -keystore "$GIP_KEYSTORE" -storepass android -alias androiddebugkey \
            | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          obtenida=$("$apksigner" verify --print-certs gip-*.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "Firma de la llave fija: $esperada"
          echo "Firma del APK:          $obtenida"
          if [ -z "$esperada" ] || [ "$esperada" != "$obtenida" ]; then
            echo "::error::El APK no salió firmado con la llave fija."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gip-apk
          path: gip-*.apk
          retention-days: 14

      - name: Publicar en la pre-release apk-dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-dev --cleanup-tag --yes || true
          gh release create apk-dev gip-*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "APK de prueba (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})" \
            --notes "Generado por el workflow APK de prueba. Instalar sobre la versión anterior (misma firma)."
